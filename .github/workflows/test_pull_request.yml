# Pull-request / main CI gate, and the full test set release.yml runs before it publishes:
# script tests, the server build and tests, the plugin library tests, and a Docker build.

name: test-pull-request

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Offline unit tests of the release dependency guard (a fake nuget.org) and of
      # build/build_all.py (a fake dotnet).
      - name: Script unit tests (release dependency guard, build_all.py)
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Restore
        run: dotnet restore com.RedPand.MCP.Server.csproj

      - name: Build (Release)
        run: dotnet build com.RedPand.MCP.Server.csproj -c Release --no-restore

      - name: Server tests
        run: dotnet test tests/GameDev.MCP.Server.Tests/GameDev.MCP.Server.Tests.csproj -c Release

      - name: Plugin library tests
        run: dotnet test lib/McpPlugin.Tests/McpPlugin.Tests.csproj -c Release

      - name: Plugin library server tests
        run: dotnet test lib/McpPlugin.Server.Tests/McpPlugin.Server.Tests.csproj -c Release

      - name: Validate Dockerfile (build image, no push)
        run: docker build -t redpand-mcp-server:ci .
