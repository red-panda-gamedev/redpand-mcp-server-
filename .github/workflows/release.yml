# Based on the GameDev-MCP-Server workflows, Copyright (c) 2026 Ivan Murzak (Apache-2.0).

# The only way to release the server: push a tag `v<version>` that matches the csproj <Version>.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# A manual dispatch (Actions -> release -> Run workflow) is a dry run: it runs every test and
# build and publishes nothing.
#
# Order (every publishing job needs the full test set):
#   guard -> test -> executables (7 zips) + Docker image (GHCR)
#         -> GitHub Release on the tag (zips + SHA256SUMS) -> verify
#
# Version source: the csproj <Version>. server.json's `version` and its OCI identifier tag must
# match it, and so must the pushed tag (v<version>).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Every NuGet pin the executables and the image are built from must be a published nuget.org
      # release, restored without a local feed.
      - name: Release dependency guard (no pre-release / unpublished pins, no local feed)
        run: python3 scripts/release_dependency_guard.py

      - name: Read version (csproj <Version>, server.json and the tag in lockstep)
        id: version
        run: |
          set -euo pipefail
          version="$(grep -oP '<Version>\K[^<]+' com.RedPand.MCP.Server.csproj || true)"
          count="$(printf '%s\n' "$version" | grep -c . || true)"
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly one <Version> in com.RedPand.MCP.Server.csproj, found $count."
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::csproj <Version> '$version' is not strict MAJOR.MINOR.PATCH."
            exit 1
          fi
          sj="$(python3 -c 'import json; d=json.load(open("server.json", encoding="utf-8")); print(d.get("version", ""), ((d.get("packages") or [{}])[0]).get("identifier", "").rsplit(":", 1)[-1])')"
          if [ "$sj" != "$version $version" ]; then
            echo "::error::server.json (version, OCI identifier tag) = '$sj' are not both equal to the csproj <Version> $version."
            exit 1
          fi
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
              echo "::error::Tag $GITHUB_REF does not match the csproj <Version> $version (expected refs/tags/v$version)."
              exit 1
            fi
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release version: $version (tag v$version, publish=$publish)"

      - name: Release guard (the GitHub Release must not exist yet)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet."
            exit 0
          fi
          if [ "$PUBLISH" != "true" ]; then
            echo "::warning::Release $TAG already exists; pushing its tag again would fail here. Continuing the dry run."
            exit 0
          fi
          echo "::error::Release $TAG already exists. Bump the csproj <Version> and server.json, then push a new tag."
          exit 1

  test:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/test_pull_request.yml

  executables:
    needs: [guard, test]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy_server_executables.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      dry_run: ${{ needs.guard.outputs.publish != 'true' }}
    secrets: inherit

  docker:
    needs: [guard, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy_docker.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      dry_run: ${{ needs.guard.outputs.publish != 'true' }}

  # The GitHub Release on the pushed tag, with the 7 zips and a plain SHA256SUMS manifest
  # (coreutils format, `<hex>  <file>`, sorted by file name) computed from them.
  github-release:
    needs: [guard, executables, docker]
    if: ${{ needs.guard.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download server zips
        uses: actions/download-artifact@v8
        with:
          pattern: server-zips-*
          merge-multiple: true
          path: assets

      - name: Check all 7 zips + compute SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          missing=0
          for rid in win-x64 win-x86 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            if [ ! -f "redpand-mcp-server-${rid}.zip" ]; then
              echo "::error::missing redpand-mcp-server-${rid}.zip"
              missing=1
            fi
          done
          ls -la
          [ "$missing" = "0" ] || exit 1
          sha256sum --text redpand-mcp-server-*.zip | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          cd assets
          files=(redpand-mcp-server-*.zip SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            # Only reachable by re-running this job inside the same run.
            echo "Release $TAG already exists; re-uploading assets."
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "RedPand MCP Server $VERSION" \
              --generate-notes
          fi

  verify:
    needs: [guard, github-release]
    if: ${{ needs.guard.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: GHCR image tag exists
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools inspect "ghcr.io/red-panda-gamedev/redpand-mcp-server:$VERSION"

      - name: GitHub Release carries all 7 zips + SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft --jq 'if .isDraft then error("release is a draft") else .assets[].name end')"
          echo "$names"
          missing=0
          for f in redpand-mcp-server-win-x64.zip redpand-mcp-server-win-x86.zip redpand-mcp-server-win-arm64.zip \
                   redpand-mcp-server-linux-x64.zip redpand-mcp-server-linux-arm64.zip \
                   redpand-mcp-server-osx-x64.zip redpand-mcp-server-osx-arm64.zip SHA256SUMS; do
            if ! grep -qxF "$f" <<<"$names"; then
              echo "::error::Release $TAG is missing asset $f"
              missing=1
            fi
          done
          exit "$missing"
