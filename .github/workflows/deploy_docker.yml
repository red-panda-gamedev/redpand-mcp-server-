# Builds the multi-arch Docker image and pushes it to GHCR
# (ghcr.io/red-panda-gamedev/redpand-mcp-server). A reusable child of release.yml only.
# On dry_run the image is still built, but nothing is pushed.

name: deploy-docker

on:
  workflow_call:
    inputs:
      version:
        description: "Image version (e.g., 1.0.0), no 'v' prefix."
        required: true
        type: string
      dry_run:
        description: "Build the image but do not log in or push."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          tags: |
            ghcr.io/red-panda-gamedev/redpand-mcp-server:${{ inputs.version }}
            ghcr.io/red-panda-gamedev/redpand-mcp-server:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          # A dry run reads the layer cache but never writes it.
          cache-to: ${{ !inputs.dry_run && 'type=gha,mode=max' || '' }}
